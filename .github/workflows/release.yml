name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            asset: pve-computer-use-linux-x64
          - target: bun-linux-arm64
            asset: pve-computer-use-linux-arm64
          - target: bun-darwin-x64
            asset: pve-computer-use-darwin-x64
          - target: bun-darwin-arm64
            asset: pve-computer-use-darwin-arm64
          - target: bun-windows-x64
            asset: pve-computer-use-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Compile ${{ matrix.target }}
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} \
            --outfile="dist/${{ matrix.asset }}" \
            src/index.ts

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
